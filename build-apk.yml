name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # "Run workflow" button se bhi chala sakte hain

permissions:
  contents: write           # APK ko Releases me daalne ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix file names (remove " (1)" from names)
        run: |
          for f in *; do
            n=$(echo "$f" | sed -E 's/ \([0-9]+\)(\.[^.]*)$/\1/')
            if [ "$f" != "$n" ]; then mv -f "$f" "$n"; fi
          done
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Prepare web files, fonts and SQLite code
        run: npm run prepare-web

      - name: Create Android project
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO $M || sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n<queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n</manifest>#' $M
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SalesDashboard.apk

      - name: Save APK in Actions (backup download)
        uses: actions/upload-artifact@v4
        with:
          name: SalesDashboard-APK
          path: SalesDashboard.apk
          if-no-files-found: error

      - name: Publish APK in Releases (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sales Dashboard - build ${{ github.run_number }}
          body: Phone me SalesDashboard.apk download kar ke install karein.
          files: SalesDashboard.apk
          make_latest: true
